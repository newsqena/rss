name: Bot 2 - حوادث

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10,17 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # إعطاء البوت صلاحية الكتابة لحفظ ملف الـ txt

    env:
      TZ: Africa/Cairo
      BLOGGER_CREDS_JSON: ${{ secrets.BLOGGER_CREDS_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true # مهم جداً للسماح برفع الملفات

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python main.py
        env:
          RSS_URL: https://www.elbalad.news/rss.aspx?id=4
          BLOGGER_LABELS: حوادث
          BOT_NAME: Bot 2
          SCRAPE_MODE: custom

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          touch accidents_published_urls # إنشاء الملف إذا لم يكن موجوداً
          git add accidents_published_urls.txt
          git commit -m "Update published articles list" || exit 0
          git push
